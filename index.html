<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On laughing at life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight: #090d22;
    --indigo:   #1a1f4a;
    --plum:     #3b2a5e;
    --dusk:     #8a5a7a;
    --gold:     #e8c982;
    --ivory:    #f6efe2;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Jost", system-ui, sans-serif;
    color: var(--ivory);
    background: var(--midnight);
    overflow: hidden;
  }

  /* ---------- Background scene ---------- */
  .scene {
    position: fixed;
    inset: 0;
    /* To use your own photo, drop bg.jpg next to this file.
       The gradient below stays as the fallback and tint. */
    background:
      linear-gradient(to bottom, rgba(9,13,34,.35), rgba(9,13,34,.1) 50%, rgba(9,13,34,.55)),
      url("bg.jpg") center / cover no-repeat,
      linear-gradient(to bottom, var(--midnight) 0%, var(--indigo) 45%, var(--plum) 75%, var(--dusk) 100%);
  }

  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  .moon {
    position: absolute;
    top: 12%;
    right: 14%;
    width: clamp(70px, 9vw, 130px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffaf0, #f0dfb8 70%);
    box-shadow: 0 0 60px 20px rgba(246,239,226,.25), 0 0 200px 80px rgba(232,201,130,.12);
  }

  .ridge {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 42vh;
  }

  /* ---------- Content ---------- */
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem 6rem;
  }

  figure {
    max-width: 58rem;
    text-align: center;
    animation: rise 2.4s ease-out both;
  }

  .rule {
    width: 4.5rem;
    height: 1px;
    margin: 0 auto 2.2rem;
    background: var(--gold);
  }

  blockquote {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 5.4vw, 4rem);
    line-height: 1.22;
    text-wrap: balance;
    text-shadow: 0 2px 30px rgba(9,13,34,.7);
  }

  figcaption {
    margin-top: 2.4rem;
    font-weight: 300;
    font-size: .95rem;
    letter-spacing: .08em;
    color: var(--gold);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Music control ---------- */
  #music {
    position: fixed;
    z-index: 3;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: .7rem;
    font: 300 .9rem "Jost", sans-serif;
    letter-spacing: .06em;
    color: var(--ivory);
    background: rgba(9,13,34,.45);
    border: 1px solid rgba(232,201,130,.5);
    border-radius: 999px;
    padding: .65rem 1.3rem;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .3s, border-color .3s;
  }
  #music:hover { background: rgba(9,13,34,.7); border-color: var(--gold); }
  #music:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i {
    width: 2px;
    height: 4px;
    background: var(--gold);
    transition: height .3s;
  }
  #music.on .bars i { animation: eq 1.4s ease-in-out infinite alternate; }
  #music.on .bars i:nth-child(2) { animation-delay: -.4s; }
  #music.on .bars i:nth-child(3) { animation-delay: -.8s; }
  @keyframes eq { from { height: 3px; } to { height: 14px; } }

  @media (prefers-reduced-motion: reduce) {
    figure { animation: none; }
    #music.on .bars i { animation: none; height: 9px; }
  }
</style>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="moon"></div>

    <svg class="ridge" viewBox="0 0 1440 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="far"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3772"/><stop offset="1" stop-color="#2a2150"/></linearGradient>
        <linearGradient id="mid"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2457"/><stop offset="1" stop-color="#17173a"/></linearGradient>
        <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14122f"/><stop offset="1" stop-color="#090d22"/></linearGradient>
      </defs>
      <path fill="url(#far)"  opacity=".85" d="M0 230 L120 170 L230 215 L360 120 L470 200 L590 150 L720 225 L850 110 L980 205 L1100 150 L1230 215 L1340 160 L1440 205 V400 H0Z"/>
      <path fill="url(#mid)"  opacity=".95" d="M0 285 L140 225 L260 270 L400 195 L530 275 L660 215 L790 285 L930 205 L1060 275 L1190 225 L1320 280 L1440 240 V400 H0Z"/>
      <path fill="url(#near)" d="M0 340 L160 295 L300 335 L450 285 L600 340 L760 300 L910 345 L1060 295 L1210 340 L1340 305 L1440 330 V400 H0Z"/>
    </svg>
  </div>

  <main>
    <figure>
      <div class="rule" aria-hidden="true"></div>
      <blockquote>&ldquo;I suppose if we couldn&rsquo;t laugh at things that don&rsquo;t make sense, we couldn&rsquo;t react to a lot of life.&rdquo;</blockquote>
      <figcaption>Calvin &nbsp;·&nbsp; Bill Watterson, <em>Calvin and Hobbes</em></figcaption>
    </figure>
  </main>

  <button id="music" type="button" aria-pressed="false">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="label">Play ambient music</span>
  </button>

<script>
/* ---------- Stars ---------- */
(function () {
  const c = document.getElementById("stars");
  const g = c.getContext("2d");
  let stars = [];

  function size() {
    c.width = innerWidth;
    c.height = innerHeight;
    stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 5000) }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height * 0.75,
      r: Math.random() * 1.2 + 0.2,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.02 + 0.005
    }));
  }

  function draw(t) {
    g.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      const a = 0.45 + 0.55 * Math.sin(s.p + t * s.s * 0.06);
      g.fillStyle = "rgba(246,239,226," + a.toFixed(2) + ")";
      g.beginPath();
      g.arc(s.x, s.y, s.r, 0, 6.283);
      g.fill();
    }
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(draw);
  }

  addEventListener("resize", size);
  size();
  requestAnimationFrame(draw);
})();

/* ---------- Ambient music (generated live, no audio file needed) ---------- */
(function () {
  const btn = document.getElementById("music");
  const label = document.getElementById("label");
  let ctx, master, reverb, timer, step = 0, playing = false;

  const chords = [
    [110.00, 164.81, 196.00, 246.94, 261.63],   // Am9
    [ 87.31, 130.81, 164.81, 220.00, 261.63],   // Fmaj7
    [130.81, 196.00, 246.94, 329.63],           // Cmaj7
    [ 98.00, 146.83, 220.00, 246.94, 329.63]    // G6/9
  ];
  const bells = [440, 523.25, 659.25, 783.99, 880];

  function impulse(seconds) {
    const rate = ctx.sampleRate, len = rate * seconds;
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    return buf;
  }

  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1400;
    reverb = ctx.createConvolver();
    reverb.buffer = impulse(4);
    const wet = ctx.createGain();
    wet.gain.value = 0.6;
    lp.connect(master);
    lp.connect(reverb);
    reverb.connect(wet);
    wet.connect(master);
    master.connect(ctx.destination);
    ctx.bus = lp;
  }

  function tone(freq, start, attack, hold, release, peak, type) {
    const o = ctx.createOscillator(), e = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.detune.value = (Math.random() - 0.5) * 8;
    e.gain.setValueAtTime(0.0001, start);
    e.gain.linearRampToValueAtTime(peak, start + attack);
    e.gain.setValueAtTime(peak, start + attack + hold);
    e.gain.exponentialRampToValueAtTime(0.0001, start + attack + hold + release);
    o.connect(e);
    e.connect(ctx.bus);
    o.start(start);
    o.stop(start + attack + hold + release + 0.1);
  }

  function nextChord() {
    const t = ctx.currentTime + 0.05;
    chords[step % chords.length].forEach(f => tone(f, t, 3.5, 2.5, 4.5, 0.05, "triangle"));
    for (let i = 0; i < 3; i++) {
      if (Math.random() < 0.7) {
        const f = bells[Math.floor(Math.random() * bells.length)];
        tone(f, t + 1.5 + i * 2.2 + Math.random(), 0.02, 0, 4, 0.04, "sine");
      }
    }
    step++;
  }

  btn.addEventListener("click", async () => {
    if (!ctx) setup();
    if (!playing) {
      await ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 3);
      nextChord();
      timer = setInterval(nextChord, 8000);
      playing = true;
    } else {
      clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
      setTimeout(() => ctx.suspend(), 1700);
      playing = false;
    }
    btn.classList.toggle("on", playing);
    btn.setAttribute("aria-pressed", playing);
    label.textContent = playing ? "Pause music" : "Play ambient music";
  });
})();
</script>
</body>
</html>
