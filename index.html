<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Hello from Cloudflare 🚀</h1>

    <p>This page is hosted from GitHub.</p>

    <button onclick="sayHello()">Click me</button>

    <div id="message"></div>

    <script>
        function sayHello() {
            document.getElementById("message").textContent =
                "JavaScript is working! 🎉";
        }
    </script>

</body>
</html>
