    <style>

        * {

            margin: 0;

        }

        html {
            scroll-behavior: smooth;

        body {

        a {
            color: inherit;

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            z-index: 100;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 7%;

            background: rgba(8, 11, 18, 0.72);

            backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            gap: 28px;

            color: #aab2c5;

            font-size: 14px;
        }

        .nav-links a {
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding: 120px 7% 80px;

            position: relative;

            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 600px;
            height: 600px;

            background: #3157ff;

            opacity: 0.14;

            filter: blur(120px);

            border-radius: 50%;

            top: 5%;
            right: -150px;
        }

        .hero-content {
            max-width: 850px;

            position: relative;

            z-index: 2;
        }

        .eyebrow {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 999px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.1);

            color: #9ca8c4;

            font-size: 13px;

            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 110px);

            line-height: 0.95;

            letter-spacing: -5px;

            margin-bottom: 30px;
        }

        .gradient {
            background: linear-gradient(
                90deg,
                #ffffff,
                #8ca5ff,
                #b78cff
            );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }

        .hero p {
            max-width: 650px;

            color: #aab2c5;

            font-size: 20px;

            margin-bottom: 35px;
        }

        .buttons {
            display: flex;

            gap: 14px;

            flex-wrap: wrap;
        }

        .button {
            padding: 13px 21px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 14px;

            transition: 0.25s ease;
        }

        .primary {
            background: white;

            color: #080b12;
        }

        .secondary {
            border: 1px solid rgba(255,255,255,0.15);

            color: #dce2f1;

            background: rgba(255,255,255,0.04);
        }

        .button:hover {
            transform: translateY(-3px);
        }

            text-align: center;

            box-shadow:
